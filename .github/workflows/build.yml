name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Create Project Files
        run: |
          mkdir -p app/src/main/java/com/stresstest app/src/main/res/values app/src/main/res/drawable app/src/main/res/raw
          
          # --- LOGIKA ICON ---
          if [ -f "icon.png" ]; then
            cp icon.png app/src/main/res/drawable/ic_launcher.png
          else
            cat > app/src/main/res/drawable/ic_launcher.xml << 'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#000000" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#00FF00" android:pathData="M54,20L20,40v28l34,20 34,-20v-28z"/>
              <path android:fillColor="#003300" android:pathData="M54,40L35,52v12l19,12 19,-12v-12z"/>
          </vector>
          EOF
          fi
          
          # --- LOGIKA MEDIA ---
          if [ -f "video1.mp4" ]; then cp video1.mp4 app/src/main/res/raw/video1.mp4; fi
          if [ -f "video2.mp4" ]; then cp video2.mp4 app/src/main/res/raw/video2.mp4; fi
          if [ -f "image1.png" ]; then cp image1.png app/src/main/res/drawable/image1.png; fi
          if [ -f "image2.png" ]; then cp image2.png app/src/main/res/drawable/image2.png; fi
          if [ -f "sound1.mp3" ]; then cp sound1.mp3 app/src/main/res/raw/sound1.mp3; fi
          if [ -f "sound2.mp3" ]; then cp sound2.mp3 app/src/main/res/raw/sound2.mp3; fi
          
          cat > settings.gradle.kts << 'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "CyberPrank"
          include(":app")
          EOF
          
          cat > build.gradle.kts << 'EOF'
          plugins {
              id("com.android.application") version "8.5.0" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF
          
          cat > gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          EOF
          
          cat > app/build.gradle.kts << 'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.stresstest"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.stresstest"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 20
                  versionName = "20.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies { implementation("androidx.appcompat:appcompat:1.7.0") }
          EOF
          
          cat > app/src/main/res/values/themes.xml << 'EOF'
          <resources>
              <style name="Theme.AppCompat" parent="Theme.AppCompat.DayNight.NoActionBar"/>
          </resources>
          EOF
          
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.VIBRATE"/>
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/>
              <application android:allowBackup="false" android:label="Android Test" android:icon="@drawable/ic_launcher" android:theme="@style/Theme.AppCompat">
                  <activity android:name=".MainActivity" android:exported="true" android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          
          cat > app/src/main/java/com/stresstest/MainActivity.kt << 'EOF'
          package com.stresstest
          import android.content.Context
          import android.graphics.Color
          import android.graphics.Typeface
          import android.media.AudioManager
          import android.media.MediaPlayer
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.os.VibrationEffect
          import android.os.Vibrator
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.View
          import android.view.WindowManager
          import android.view.animation.LinearInterpolator
          import android.widget.Button
          import android.widget.FrameLayout
          import android.widget.ImageView
          import android.widget.TextView
          import android.widget.VideoView
          import androidx.appcompat.app.AppCompatActivity
          import kotlin.math.hypot
          import kotlin.random.Random

          class MainActivity : AppCompatActivity() {
              private lateinit var vibrator: Vibrator
              private val mediaPlayers = mutableListOf<MediaPlayer>()
              private var isRunning = true
              private lateinit var rootLayout: FrameLayout
              private lateinit var terminalLog: TextView
              private lateinit var stopBtn: Button
              private val handler = Handler(Looper.getMainLooper())

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.setFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN, WindowManager.LayoutParams.FLAG_FULLSCREEN)
                  window.decorView.systemUiVisibility = (View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY or View.SYSTEM_UI_FLAG_LAYOUT_STABLE or View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION or View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN or View.SYSTEM_UI_FLAG_HIDE_NAVIGATION or View.SYSTEM_UI_FLAG_FULLSCREEN)

                  // --- VOLUME PAKSA MAKSIMAL ---
                  try {
                      val audioManager = getSystemService(Context.AUDIO_SERVICE) as AudioManager
                      val maxVol = audioManager.getStreamMaxVolume(AudioManager.STREAM_MUSIC)
                      audioManager.setStreamVolume(AudioManager.STREAM_MUSIC, maxVol, 0)
                  } catch (e: Exception) {}

                  rootLayout = FrameLayout(this).apply { setBackgroundColor(Color.BLACK) }
                  terminalLog = TextView(this).apply {
                      setTextColor(Color.parseColor("#00FF00"))
                      textSize = 10f
                      typeface = Typeface.MONOSPACE
                      setPadding(20, 20, 20, 20)
                      text = "> INITIALIZING SYSTEM...\n"
                  }
                  rootLayout.addView(terminalLog, FrameLayout.LayoutParams(FrameLayout.LayoutParams.MATCH_PARENT, FrameLayout.LayoutParams.MATCH_PARENT))

                  val hackerRunnable = object : Runnable {
                      override fun run() {
                          if (!isRunning) return
                          val hex = Integer.toHexString(Random.nextInt(0x1000000)).uppercase()
                          val logs = listOf("> SCANNING SECTOR $hex", "> ACCESS GRANTED", "> WARNING: INTRUDER DETECTED", "> BYPASSING FIREWALL...", "> DATA EXTRACTED: OK", "> EVASION PROTOCOL ON")
                          terminalLog.append(logs.random() + "\n")
                          if (terminalLog.text.length > 2000) terminalLog.text = "> SYSTEM OVERRIDE...\n"
                          handler.postDelayed(this, 150)
                      }
                  }
                  handler.post(hackerRunnable)

                  val flyingViews = mutableListOf<View>()
                  
                  // --- MEDIA TERBANG ---
                  for (i in 1..2) {
                      val vidId = resources.getIdentifier("video$i", "raw", packageName)
                      if (vidId != 0) {
                          val vv = VideoView(this).apply {
                              setVideoURI(Uri.parse("android.resource://$packageName/$vidId"))
                              setOnPreparedListener { mp -> mp.isLooping = true; mp.setVolume(1f, 1f); start() }
                          }
                          val params = FrameLayout.LayoutParams(350, 350)
                          params.gravity = Gravity.CENTER
                          rootLayout.addView(vv, params)
                          flyingViews.add(vv)
                      }
                  }
                  for (i in 1..2) {
                      val imgId = resources.getIdentifier("image$i", "drawable", packageName)
                      if (imgId != 0) {
                          val iv = ImageView(this).apply {
                              setImageResource(imgId)
                              scaleType = ImageView.ScaleType.CENTER_CROP
                          }
                          val params = FrameLayout.LayoutParams(400, 400)
                          params.gravity = Gravity.CENTER
                          rootLayout.addView(iv, params)
                          flyingViews.add(iv)
                      }
                  }

                  // --- TEKS TERBANG "Created by Rudoo" ---
                  val flyingTextView = TextView(this).apply {
                      text = "Created by Rudoo"
                      setTextColor(Color.CYAN)
                      textSize = 35f
                      typeface = Typeface.DEFAULT_BOLD
                      setShadowLayer(15f, 0f, 0f, Color.BLUE)
                  }
                  val textParams = FrameLayout.LayoutParams(FrameLayout.LayoutParams.WRAP_CONTENT, FrameLayout.LayoutParams.WRAP_CONTENT)
                  textParams.gravity = Gravity.CENTER
                  rootLayout.addView(flyingTextView, textParams)
                  flyingViews.add(flyingTextView)

                  // --- TOMBOL X MERAH (DELAY 10 DETIK) ---
                  stopBtn = Button(this).apply {
                      text = "X"
                      setTextColor(Color.WHITE)
                      setBackgroundColor(Color.RED)
                      visibility = View.INVISIBLE
                      val btnParams = FrameLayout.LayoutParams(120, 120)
                      btnParams.gravity = Gravity.CENTER
                      layoutParams = btnParams
                      setOnClickListener { stopPrank(); finish() }
                  }
                  rootLayout.addView(stopBtn)
                  stopBtn.bringToFront()

                  handler.postDelayed({
                      if (isRunning) {
                          stopBtn.visibility = View.VISIBLE
                          terminalLog.append("\n> ERROR: TERMINATE BUTTON UNLOCKED\n")
                      }
                  }, 10000)

                  rootLayout.setOnTouchListener { _, event ->
                      if (event.action == MotionEvent.ACTION_MOVE || event.action == MotionEvent.ACTION_DOWN) {
                          if (stopBtn.visibility == View.VISIBLE) {
                              val touchX = event.x
                              val touchY = event.y
                              val btnX = stopBtn.x + (stopBtn.width / 2)
                              val btnY = stopBtn.y + (stopBtn.height / 2)
                              if (hypot(touchX - btnX, touchY - btnY) < 250f) {
                                  val newX = Random.nextInt(0, rootLayout.width - stopBtn.width).toFloat()
                                  val newY = Random.nextInt(0, rootLayout.height - stopBtn.height).toFloat()
                                  stopBtn.animate().translationX(newX - (rootLayout.width / 2f - stopBtn.width / 2f)).translationY(newY - (rootLayout.height / 2f - stopBtn.height / 2f)).setDuration(0).start()
                              }
                          }
                      }
                      true
                  }

                  setContentView(rootLayout)
                  startVibration()
                  startMultiSound()
                  rootLayout.post { flyingViews.forEach { startFlying(it) } }
              }

              private fun startFlying(view: View) {
                  val runnable = object : Runnable {
                      override fun run() {
                          if (!isRunning) return
                          val screenWidth = rootLayout.width
                          val screenHeight = rootLayout.height
                          if (screenWidth == 0 || screenHeight == 0) { handler.postDelayed(this, 100); return }
                          val viewWidth = view.width.takeIf { it > 0 } ?: 200
                          val viewHeight = view.height.takeIf { it > 0 } ?: 200
                          val targetX = Random.nextInt(screenWidth - viewWidth).toFloat()
                          val targetY = Random.nextInt(screenHeight - viewHeight).toFloat()
                          
                          view.animate()
                              .translationX(targetX - (screenWidth / 2f - viewWidth / 2f))
                              .translationY(targetY - (screenHeight / 2f - viewHeight / 2f))
                              .setDuration(300L + Random.nextInt(700))
                              .setInterpolator(LinearInterpolator())
                              .withEndAction { if (isRunning) handler.post(this) }
                              .start()
                      }
                  }
                  handler.post(runnable)
              }

              private fun startVibration() {
                  vibrator = getSystemService(VIBRATOR_SERVICE) as Vibrator
                  val pattern = longArrayOf(0, 300, 100, 300, 100, 500)
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) vibrator.vibrate(VibrationEffect.createWaveform(pattern, 0))
                  else { @Suppress("DEPRECATION") vibrator.vibrate(pattern, 0) }
              }

              private fun startMultiSound() {
                  for (i in 1..2) {
                      val soundId = resources.getIdentifier("sound$i", "raw", packageName)
                      if (soundId != 0) {
                          val mp = MediaPlayer.create(this, soundId)
                          mp?.apply {
                              isLooping = true // <--- INI BIAR MUTER TERUS
                              setVolume(1f, 1f)
                              start()
                              mediaPlayers.add(this)
                          }
                      }
                  }
              }

              private fun stopPrank() {
                  isRunning = false
                  handler.removeCallbacksAndMessages(null)
                  vibrator.cancel()
                  mediaPlayers.forEach { try { it.stop(); it.release() } catch (e: Exception) {} }
                  mediaPlayers.clear()
              }

              override fun onDestroy() { stopPrank(); super.onDestroy() }
              override fun onBackPressed() { }
          }
          EOF
      - name: Build Debug APK
        run: |
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: AndroidTest-APK
          path: app/build/outputs/apk/debug/*.apk
